<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Kwakcamole.archive — works</title>

  <link
    rel="stylesheet"
    href="style.css?v=works-json-1"
  />

  <style>
    /* =========================================
       WORKS PAGE ONLY
       HOME / ABOUT / CONTACT에는 영향 없음
    ========================================= */

    body.page-works {
      margin: 0;
      padding: 0;
    }


    /* Works 전체 영역 */
    body.page-works #worksPageWrap {
      width: 100% !important;
      max-width: none !important;

      margin: 0 !important;
      padding: 145px 32px 140px !important;

      box-sizing: border-box !important;
    }


    /* =========================================
       CATEGORY FILTER
    ========================================= */

    body.page-works .works-filter {
      width: 100%;
      max-width: 1800px;

      margin: 0 auto 38px;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      column-gap: 26px;
      row-gap: 12px;

      box-sizing: border-box;
    }


    body.page-works .filter-button {
      position: relative;

      margin: 0;
      padding: 3px 0 5px;

      border: 0;
      border-bottom: 1px solid transparent;

      background: transparent;
      color: #999999;

      font-family: "Paperlogy", sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0.02em;

      cursor: pointer;

      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        opacity 0.2s ease;
    }


    body.page-works .filter-button:hover {
      color: #111111;
    }


    body.page-works .filter-button.is-active {
      color: #111111;
      border-bottom-color: #111111;
    }


    body.page-works .filter-button:focus-visible {
      outline: 1px dashed #f6a1c6;
      outline-offset: 6px;
    }


    /* =========================================
       WORK GRID
    ========================================= */

    body.page-works #worksGrid {
      display: grid !important;

      grid-template-columns:
        repeat(4, minmax(0, 1fr)) !important;

      column-gap: 24px !important;
      row-gap: 56px !important;

      width: 100% !important;
      max-width: 1800px !important;

      margin: 0 auto !important;
      padding: 0 !important;

      align-items: start !important;
      justify-items: stretch !important;

      box-sizing: border-box !important;
    }


    body.page-works #worksGrid .work-card {
      display: block !important;

      width: 100% !important;
      max-width: none !important;
      min-width: 0 !important;

      margin: 0 !important;
      padding: 0 !important;

      text-align: center !important;

      box-sizing: border-box !important;
    }


    body.page-works #worksGrid .work-card.is-hidden {
      display: none !important;
    }


    body.page-works #worksGrid .work-img {
      display: block !important;

      width: 100% !important;
      max-width: none !important;
      height: auto !important;

      margin: 0 0 15px !important;
      padding: 0 !important;

      aspect-ratio: 3 / 2 !important;
      object-fit: cover !important;

      border-radius: 12px !important;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }


    body.page-works
    #worksGrid
    .work-card:hover
    .work-img {
      transform: translateY(-3px);
      opacity: 0.96;
    }


    body.page-works #worksGrid .work-title {
      margin: 0 0 4px !important;
      padding: 0 4px !important;

      font-family: "Paperlogy", sans-serif !important;
      font-size: 15px !important;
      line-height: 1.3 !important;
      font-weight: 700 !important;
      letter-spacing: 0.01em !important;

      text-align: center !important;
      word-break: keep-all !important;
    }


    body.page-works #worksGrid .work-sub {
      margin: 0 !important;
      padding: 0 4px !important;

      color: #777777 !important;

      font-family: "Paperlogy", sans-serif !important;
      font-size: 12px !important;
      line-height: 1.4 !important;
      font-weight: 400 !important;

      text-align: center !important;
      opacity: 1 !important;
    }


    .works-error {
      grid-column: 1 / -1;

      padding: 80px 20px;

      font-family: "Paperlogy", sans-serif;
      font-size: 14px;

      text-align: center;

      color: #999999;
    }


    /* =========================================
       TABLET / MOBILE
    ========================================= */

    @media screen and (max-width: 700px) {

      body.page-works #worksPageWrap {
        padding: 100px 16px 80px !important;
      }


      body.page-works .works-filter {
        margin-bottom: 28px;

        column-gap: 18px;
        row-gap: 10px;
      }


      body.page-works .filter-button {
        font-size: 12px;
      }


      body.page-works #worksGrid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr)) !important;

        column-gap: 14px !important;
        row-gap: 42px !important;
      }


      body.page-works #worksGrid .work-img {
        margin-bottom: 12px !important;
        border-radius: 10px !important;
      }


      body.page-works #worksGrid .work-title {
        font-size: 13px !important;
      }


      body.page-works #worksGrid .work-sub {
        font-size: 11px !important;
      }
    }


    @media screen and (max-width: 420px) {

      body.page-works #worksGrid {
        grid-template-columns: 1fr !important;
        row-gap: 44px !important;
      }


      body.page-works #worksGrid .work-title {
        font-size: 14px !important;
      }


      body.page-works #worksGrid .work-sub {
        font-size: 12px !important;
      }
    }
  </style>

</head>


<body class="page-works">


  <!-- =========================================
       TOP FIXED HEADER
  ========================================== -->

  <header class="top">

    <div
      class="top-left"
      id="favHeart"
    >
      fav ♥
    </div>


    <a
      class="top-title"
      href="index.html"
    >
      Kwakcamole.archive
    </a>


    <a
      class="top-right"
      href="https://www.instagram.com/kwakcamole.archive/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Kwakcamole archive Instagram"
    >
      <img
        src="/images/집.png"
        alt="Instagram"
      >
    </a>

  </header>



  <!-- =========================================
       WORKS PAGE
  ========================================== -->

  <main
    class="works-wrap"
    id="worksPageWrap"
  >


    <!-- CATEGORY FILTER -->

    <nav
      class="works-filter"
      aria-label="Filter works by category"
    >

      <button
        class="filter-button is-active"
        type="button"
        data-filter="all"
        aria-pressed="true"
      >
        All
      </button>


      <button
        class="filter-button"
        type="button"
        data-filter="soft-spaces"
        aria-pressed="false"
      >
        Soft Spaces
      </button>


      <button
        class="filter-button"
        type="button"
        data-filter="soft-objects"
        aria-pressed="false"
      >
        Soft Objects
      </button>


      <button
        class="filter-button"
        type="button"
        data-filter="visual-stories"
        aria-pressed="false"
      >
        Visual Stories
      </button>

    </nav>



    <!--
      작품은 works-data.json에서
      자동으로 생성됩니다.
    -->

    <section
      class="works-grid"
      id="worksGrid"
    ></section>

  </main>



  <!-- =========================================
       IMAGE MODAL
  ========================================== -->

  <div
    class="modal"
    id="imgModal"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      data-close="1"
    ></div>


    <div
      class="modal-panel"
      role="dialog"
      aria-modal="true"
    >

      <button
        class="modal-close"
        type="button"
        data-close="1"
        aria-label="close image"
      >
        ×
      </button>


      <button
        class="modal-nav prev"
        type="button"
        aria-label="previous image"
      >
        ‹
      </button>


      <button
        class="modal-nav next"
        type="button"
        aria-label="next image"
      >
        ›
      </button>


      <img
        class="modal-img"
        id="modalImg"
        alt=""
      >


      <div
        class="modal-caption"
        id="modalCaption"
      ></div>

    </div>

  </div>



  <!-- =========================================
       WORKS JSON
  ========================================== -->

  <script>

    const DEFAULT_DESCRIPTION =
      "AI-generated digital image, 2026";


    let allWorks = [];

    let visibleWorks = [];

    let currentModalIndex = 0;



    /* =========================================
       작품 카드 생성
    ========================================= */

    function createWorkCard(work) {

      const article =
        document.createElement("article");


      article.className =
        "work-card";


      article.dataset.category =
        work.category || "visual-stories";



      const image =
        document.createElement("img");


      image.className =
        "work-img";


      image.src =
        work.image;


      image.alt =
        work.title || "Kwakcamole archive work";


      image.loading =
        "lazy";



      const title =
        document.createElement("h3");


      title.className =
        "work-title";


      title.textContent =
        work.title || "Untitled";



      const description =
        document.createElement("p");


      description.className =
        "work-sub";


      description.textContent =
        work.description ||
        DEFAULT_DESCRIPTION;



      article.appendChild(image);

      article.appendChild(title);

      article.appendChild(description);



      image.addEventListener(
        "click",
        function () {

          openModal(work);

        }
      );


      return article;
    }



    /* =========================================
       작품 렌더링
    ========================================= */

    function renderWorks(filter = "all") {

      const grid =
        document.getElementById("worksGrid");


      grid.innerHTML = "";


      visibleWorks =
        allWorks.filter(
          function (work) {

            return (
              filter === "all" ||
              work.category === filter
            );

          }
        );


      visibleWorks.forEach(
        function (work) {

          grid.appendChild(
            createWorkCard(work)
          );

        }
      );

    }



    /* =========================================
       CATEGORY FILTER
    ========================================= */

    function setupFilters() {

      const filterButtons =
        document.querySelectorAll(
          ".filter-button"
        );


      filterButtons.forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              const selectedCategory =
                button.dataset.filter;


              filterButtons.forEach(
                function (item) {

                  item.classList.remove(
                    "is-active"
                  );


                  item.setAttribute(
                    "aria-pressed",
                    "false"
                  );

                }
              );


              button.classList.add(
                "is-active"
              );


              button.setAttribute(
                "aria-pressed",
                "true"
              );


              renderWorks(
                selectedCategory
              );

            }
          );

        }
      );

    }



    /* =========================================
       MODAL
    ========================================= */

    const modal =
      document.getElementById(
        "imgModal"
      );


    const modalImg =
      document.getElementById(
        "modalImg"
      );


    const modalCaption =
      document.getElementById(
        "modalCaption"
      );


    function openModal(work) {

      currentModalIndex =
        visibleWorks.indexOf(work);


      showModalWork(
        currentModalIndex
      );


      modal.classList.add(
        "is-open"
      );


      modal.setAttribute(
        "aria-hidden",
        "false"
      );

    }



    function showModalWork(index) {

      if (
        !visibleWorks.length
      ) {
        return;
      }


      if (
        index < 0
      ) {
        index =
          visibleWorks.length - 1;
      }


      if (
        index >= visibleWorks.length
      ) {
        index = 0;
      }


      currentModalIndex =
        index;


      const work =
        visibleWorks[index];


      modalImg.src =
        work.image;


      modalImg.alt =
        work.title || "";


      modalCaption.textContent =
        work.title || "";

    }



    function closeModal() {

      modal.classList.remove(
        "is-open"
      );


      modal.setAttribute(
        "aria-hidden",
        "true"
      );

    }



    document
      .querySelectorAll(
        "[data-close='1']"
      )
      .forEach(
        function (element) {

          element.addEventListener(
            "click",
            closeModal
          );

        }
      );



    document
      .querySelector(
        ".modal-nav.prev"
      )
      .addEventListener(
        "click",
        function () {

          showModalWork(
            currentModalIndex - 1
          );

        }
      );



    document
      .querySelector(
        ".modal-nav.next"
      )
      .addEventListener(
        "click",
        function () {

          showModalWork(
            currentModalIndex + 1
          );

        }
      );



    document.addEventListener(
      "keydown",
      function (event) {

        if (
          !modal.classList.contains(
            "is-open"
          )
        ) {
          return;
        }


        if (
          event.key === "Escape"
        ) {
          closeModal();
        }


        if (
          event.key === "ArrowLeft"
        ) {
          showModalWork(
            currentModalIndex - 1
          );
        }


        if (
          event.key === "ArrowRight"
        ) {
          showModalWork(
            currentModalIndex + 1
          );
        }

      }
    );



    /* =========================================
       JSON 불러오기
    ========================================= */

    fetch(
      "works-data.json?v=" +
      Date.now()
    )

      .then(
        function (response) {

          if (
            !response.ok
          ) {
            throw new Error(
              "works-data.json could not be loaded"
            );
          }


          return response.json();

        }
      )

      .then(
        function (data) {

          if (
            !Array.isArray(data)
          ) {
            throw new Error(
              "works-data.json must be an array"
            );
          }


          allWorks =
            data;


          renderWorks("all");

          setupFilters();

        }
      )

      .catch(
        function (error) {

          console.error(
            error
          );


          const grid =
            document.getElementById(
              "worksGrid"
            );


          grid.innerHTML =
            '<p class="works-error">Works could not be loaded.</p>';

        }
      );

  </script>



  <!-- 기존 사이트 공통 JavaScript -->

  <script
    src="script.js?v=20260916-works-json"
  ></script>


</body>

</html>
