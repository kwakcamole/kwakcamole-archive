<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Kwakcamole.archive — works</title>

  <link
    rel="stylesheet"
    href="style.css?v=works-data-1"
  />

  <style>
    /* =========================================
       WORKS PAGE ONLY
       HOME / ABOUT / CONTACT에는 영향 없음
    ========================================= */

    body.page-works {
      margin: 0;
      padding: 0;
    }


    /* Works 전체 영역 */
    body.page-works #worksPageWrap {
      width: 100% !important;
      max-width: none !important;

      margin: 0 !important;
      padding: 145px 32px 140px !important;

      box-sizing: border-box !important;
    }


    /* =========================================
       CATEGORY FILTER
    ========================================= */

    body.page-works .works-filter {
      width: 100%;
      max-width: 1800px;

      margin: 0 auto 38px;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      column-gap: 26px;
      row-gap: 12px;

      box-sizing: border-box;
    }


    body.page-works .filter-button {
      position: relative;

      margin: 0;
      padding: 3px 0 5px;

      border: 0;
      border-bottom: 1px solid transparent;

      background: transparent;
      color: #999999;

      font-family: "Paperlogy", sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0.02em;

      cursor: pointer;

      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        opacity 0.2s ease;
    }


    body.page-works .filter-button:hover {
      color: #111111;
    }


    body.page-works .filter-button.is-active {
      color: #111111;
      border-bottom-color: #111111;
    }


    body.page-works .filter-button:focus-visible {
      outline: 1px dashed #f6a1c6;
      outline-offset: 6px;
    }


    /* =========================================
       4 COLUMN WORK GRID
    ========================================= */

    body.page-works #worksGrid {
      display: grid !important;

      grid-template-columns:
        repeat(4, minmax(0, 1fr)) !important;

      column-gap: 24px !important;
      row-gap: 56px !important;

      width: 100% !important;
      max-width: 1800px !important;

      margin: 0 auto !important;
      padding: 0 !important;

      align-items: start !important;
      justify-items: stretch !important;

      box-sizing: border-box !important;
    }


    body.page-works #worksGrid .work-card {
      display: block !important;

      width: 100% !important;
      max-width: none !important;
      min-width: 0 !important;

      margin: 0 !important;
      padding: 0 !important;

      text-align: center !important;

      box-sizing: border-box !important;

      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 0.22s ease,
        transform 0.22s ease;
    }


    body.page-works #worksGrid .work-card.is-hidden {
      display: none !important;
    }


    body.page-works #worksGrid .work-img {
      display: block !important;

      width: 100% !important;
      max-width: none !important;
      height: auto !important;

      margin: 0 0 15px !important;
      padding: 0 !important;

      aspect-ratio: 3 / 2 !important;
      object-fit: cover !important;

      border-radius: 12px !important;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }


    body.page-works
    #worksGrid
    .work-card:hover
    .work-img {
      transform: translateY(-3px);
      opacity: 0.96;
    }


    body.page-works #worksGrid .work-title {
      margin: 0 0 4px !important;
      padding: 0 4px !important;

      font-family: "Paperlogy", sans-serif !important;
      font-size: 15px !important;
      line-height: 1.3 !important;
      font-weight: 700 !important;
      letter-spacing: 0.01em !important;

      text-align: center !important;
      word-break: keep-all !important;
    }


    body.page-works #worksGrid .work-sub {
      margin: 0 !important;
      padding: 0 4px !important;

      color: #777777 !important;

      font-family: "Paperlogy", sans-serif !important;
      font-size: 12px !important;
      line-height: 1.4 !important;
      font-weight: 400 !important;

      text-align: center !important;
      opacity: 1 !important;
    }


    /* =========================================
       TABLET / MOBILE
    ========================================= */

    @media screen and (max-width: 700px) {

      body.page-works #worksPageWrap {
        padding: 100px 16px 80px !important;
      }


      body.page-works .works-filter {
        margin-bottom: 28px;

        column-gap: 18px;
        row-gap: 10px;
      }


      body.page-works .filter-button {
        font-size: 12px;
      }


      body.page-works #worksGrid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr)) !important;

        column-gap: 14px !important;
        row-gap: 42px !important;
      }


      body.page-works #worksGrid .work-img {
        margin-bottom: 12px !important;
        border-radius: 10px !important;
      }


      body.page-works #worksGrid .work-title {
        font-size: 13px !important;
      }


      body.page-works #worksGrid .work-sub {
        font-size: 11px !important;
      }
    }


    /* 아주 작은 휴대폰 */
    @media screen and (max-width: 420px) {

      body.page-works #worksGrid {
        grid-template-columns: 1fr !important;
        row-gap: 44px !important;
      }


      body.page-works #worksGrid .work-title {
        font-size: 14px !important;
      }


      body.page-works #worksGrid .work-sub {
        font-size: 12px !important;
      }
    }
  </style>

</head>


<body class="page-works">

  <!-- TOP FIXED HEADER -->

  <header class="top">

    <div
      class="top-left"
      id="favHeart"
    >
      fav ♥
    </div>


    <a
      class="top-title"
      href="index.html"
    >
      Kwakcamole.archive
    </a>


    <a
      class="top-right"
      href="https://www.instagram.com/kwakcamole.archive/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Kwakcamole archive Instagram"
    >
      <img
        src="/images/집.png"
        alt="Instagram"
      >
    </a>

  </header>


  <!-- WORKS PAGE -->

  <main
    class="works-wrap"
    id="worksPageWrap"
  >

    <!-- CATEGORY FILTER -->

    <nav
      class="works-filter"
      aria-label="Filter works by category"
    >

      <button
        class="filter-button is-active"
        type="button"
        data-filter="all"
        aria-pressed="true"
      >
        All
      </button>


      <button
        class="filter-button"
        type="button"
        data-filter="soft-spaces"
        aria-pressed="false"
      >
        Soft Spaces
      </button>


      <button
        class="filter-button"
        type="button"
        data-filter="soft-objects"
        aria-pressed="false"
      >
        Soft Objects
      </button>


      <button
        class="filter-button"
        type="button"
        data-filter="visual-stories"
        aria-pressed="false"
      >
        Visual Stories
      </button>

    </nav>


    <!-- 작품 카드는 works-data.js가 자동 생성 -->

    <section
      class="works-grid"
      id="worksGrid"
    ></section>

  </main>


  <!-- IMAGE MODAL -->

  <div
    class="modal"
    id="imgModal"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      data-close="1"
    ></div>


    <div
      class="modal-panel"
      role="dialog"
      aria-modal="true"
    >

      <button
        class="modal-close"
        type="button"
        data-close="1"
        aria-label="close image"
      >
        ×
      </button>


      <button
        class="modal-nav prev"
        type="button"
        aria-label="previous image"
      >
        ‹
      </button>


      <button
        class="modal-nav next"
        type="button"
        aria-label="next image"
      >
        ›
      </button>


      <img
        class="modal-img"
        id="modalImg"
        alt=""
      >


      <div
        class="modal-caption"
        id="modalCaption"
      ></div>

    </div>

  </div>


  <!-- 작품 데이터 -->
  <script src="works-data.js?v=works-data-1"></script>

  <!-- 기존 사이트 JavaScript -->
  <script src="script.js?v=20260722-filter-final-1"></script>

</body>

</html>
