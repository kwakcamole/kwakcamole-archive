  <style>
    /* =========================================
       SOFT NOTES — DETAIL PAGE
       note.html 전용
    ========================================= */

    body.page-note-detail {
      margin: 0;
      padding: 0;

      background: #ffffff;
      color: #111111;
    }


    body.page-note-detail * {
      box-sizing: border-box;
    }


    /* =========================================
       전체 영역
    ========================================= */

    body.page-note-detail .note-detail-wrap {
      width: calc(100% - 64px);
      max-width: 820px;

      margin: 0 auto;
      padding: 145px 0 140px;
    }


    /*
      상단 로고는 기존 MiniPizza 유지
      본문은 Contact와 같은 Paperlogy
    */

    body.page-note-detail .note-detail-wrap,
    body.page-note-detail .note-detail-wrap * {
      font-family: "Paperlogy", sans-serif;
    }


    /* =========================================
       목록으로 돌아가기
    ========================================= */

    body.page-note-detail .back-to-notes {
      display: inline-block;

      margin-bottom: 46px;

      color: #999999;

      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0;

      text-decoration: none;

      transition: color 0.2s ease;
    }


    body.page-note-detail .back-to-notes:hover {
      color: #d97eaa;
    }


    /* =========================================
       상세페이지 상단
    ========================================= */

    body.page-note-detail .note-detail-meta {
      display: flex;
      align-items: center;
      gap: 13px;

      margin-bottom: 15px;

      color: #999999;

      font-size: 11px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }


    body.page-note-detail .note-detail-number {
      color: #ef94bd;
      font-weight: 700;
    }


    body.page-note-detail .note-detail-title {
      margin: 0 0 24px;

      font-size: 36px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.04em;

      word-break: keep-all;
    }


    body.page-note-detail .note-detail-intro {
      max-width: 650px;

      margin: 0 0 44px;

      color: #555555;

      font-size: 15px;
      font-weight: 400;
      line-height: 1.9;
      letter-spacing: -0.025em;

      word-break: keep-all;
    }


    /* =========================================
       메인 이미지
    ========================================= */

    body.page-note-detail .note-figure {

    }


    body.page-note-detail .note-main-image {
      display: block;

      max-width: 720px;
      height: auto;

      margin: 0 auto;

      border-radius: 14px;
    }


    body.page-note-detail .note-image-caption {
      width: 100%;
      max-width: 720px;

      margin: 10px auto 0;

      color: #999999;

      font-size: 10px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }


    /* =========================================
       본문
    ========================================= */

    body.page-note-detail .note-body {
      width: 100%;
      max-width: 650px;

      margin: 0 auto;
    }


    body.page-note-detail .note-body p {
      margin: 0 0 24px;

      color: #444444;

      font-size: 15px;
      font-weight: 400;
      line-height: 2;
      letter-spacing: -0.025em;

      word-break: keep-all;
    }


    body.page-note-detail .note-body h2 {
      margin: 52px 0 18px;

      color: #111111;

      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.02em;

      word-break: keep-all;
    }


    body.page-note-detail .note-body img {
      display: block;

      width: 100%;
      height: auto;

      margin: 34px auto;

      border-radius: 12px;
    }


    /* =========================================
       태그
    ========================================= */

    body.page-note-detail .note-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      width: 100%;
      max-width: 650px;

      margin: 48px auto 0;
      padding-top: 28px;

      border-top: 1px solid #eeeeee;
    }


    body.page-note-detail .note-tag {
      display: inline-flex;
      align-items: center;

      min-height: 28px;

      padding: 6px 11px;

      border: 1px solid #f4bad4;
      border-radius: 999px;

      background: #fff7fb;
      color: #d97eaa;

      font-weight: 500;
      line-height: 1;

    }


    /* =========================================
       SOFT NOTE REACTIONS
    ========================================= */

    body.page-note-detail .note-reactions {
      width: 100%;
      max-width: 650px;

      margin: 38px auto 0;
      padding-top: 30px;

      border-top: 1px solid #eeeeee;

    }


    body.page-note-detail .reaction-question {
      margin: 0 0 5px;

      color: #333333;

      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }


    body.page-note-detail .reaction-sub {
      margin: 0 0 18px;

      color: #aaaaaa;

      font-size: 10px;
      font-weight: 400;
      line-height: 1.5;
    }


    body.page-note-detail .reaction-buttons {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 30px;
    }


    body.page-note-detail .note-reaction-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      min-width: 48px;

      margin: 0;
      padding: 6px 4px;

      border: 0;

      background: transparent;
      color: #999999;

      font-family: "Paperlogy", sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1;

      cursor: pointer;

      transition:
        color 0.2s ease,
        transform 0.2s ease,
        opacity 0.2s ease;
    }


    body.page-note-detail .note-reaction-button:hover {
      color: #d97eaa;
      transform: translateY(-2px);
    }


    body.page-note-detail .note-reaction-button.is-selected {
      color: #ef94bd;
    }


    body.page-note-detail .note-reaction-button:disabled {
      cursor: default;
      opacity: 0.7;
    }


    body.page-note-detail .note-reaction-button:focus-visible {
      outline: 1px dashed #ef94bd;
      outline-offset: 5px;
    }


    body.page-note-detail .reaction-symbol {
      font-size: 17px;
      line-height: 1;
    }


    body.page-note-detail .reaction-count {
      min-width: 12px;

      font-size: 10px;
      font-weight: 500;
      line-height: 1;

    }


    body.page-note-detail .reaction-status {
      min-height: 18px;

      margin: 12px 0 0;

      color: #d97eaa;

      font-size: 9px;
      font-weight: 400;
      line-height: 1.4;
    }


    /* =========================================
       오류 메시지
    ========================================= */

    body.page-note-detail .note-message {
      padding: 70px 0;

      color: #777777;

      font-size: 14px;
      line-height: 1.8;

      text-align: center;
      word-break: keep-all;
    }


    /* =========================================
       모바일
    ========================================= */

    @media screen and (max-width: 760px) {

      body.page-note-detail .note-detail-wrap {
        width: calc(100% - 32px);

        padding: 105px 0 85px;
      }


      body.page-note-detail .back-to-notes {

      }


      body.page-note-detail .note-detail-title {
        font-size: 28px;
      }


      body.page-note-detail .note-detail-intro {
        margin-bottom: 32px;

        font-size: 14px;
      }


      body.page-note-detail .note-main-image {
        border-radius: 11px;
      }


      body.page-note-detail .note-figure {
        margin-bottom: 36px;
      }


      body.page-note-detail .note-body p {
        font-size: 14px;
        line-height: 1.9;
      }


      body.page-note-detail .note-body h2 {
        margin-top: 42px;

        font-size: 18px;
      }


      body.page-note-detail .note-reactions {
        margin-top: 32px;
        padding-top: 26px;
      }


      body.page-note-detail .reaction-buttons {
        gap: 24px;
      }

    }
  </style>

<body class="page-note-detail">

  <!-- =========================================
       기존 사이트 헤더
  ========================================== -->

  <header class="top">

    <div
      class="top-left"
      id="favHeart"
    >
      fav ♥
    </div>


    <a
      class="top-title"
      href="/"
    >
      Kwakcamole.archive
    </a>


    <a
      class="top-right"
      href="https://www.instagram.com/kwakcamole.archive/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Kwakcamole archive Instagram"
    >
      <img
        src="/images/집.png"
        alt="Instagram"
      >
    </a>

  </header>


  <!-- =========================================
       NOTE DETAIL PAGE
  ========================================== -->

  <main class="note-detail-wrap">

    <!-- 목록으로 돌아가기 -->

    <a
      class="back-to-notes"
      href="/notes"
    >
      ← Soft Notes
    </a>


    <!-- 선택된 글이 자동으로 들어오는 영역 -->

    <article id="noteArticle">

      <p class="note-message">
        연구일지를 불러오는 중입니다.
      </p>

    </article>

  </main>


  <!-- =========================================
       NOTE + REACTIONS
  ========================================== -->

  <script type="module">

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://vxjimkwgdtfpcsafpots.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_DsW-3X-U5Od2r8EkfXaLLg_MHE02KVd";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================
       PAGE START
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const requestedId =
          params.get("id") || "001";


        const noteArticle =
          document.getElementById(
            "noteArticle"
          );


        /* =========================================
           IMAGE PATH
        ========================================= */

        function getAssetPath(path) {

          if (!path) {
            return "";
          }


          if (
            path.startsWith("/") ||
            path.startsWith("http://") ||
            path.startsWith("https://")
          ) {
            return path;
          }


          return "/" + path;
        }


        /* =========================================
           DATE
        ========================================= */

        function formatNoteDate(note) {

          if (
            note &&
            typeof note.date === "string" &&
            note.date.trim()
          ) {
            return note.date;
          }


          const value =
            note && note.datetime
              ? String(note.datetime)
              : "";


          const match =
            value.match(
              /^(\d{4})-(\d{2})-(\d{2})/
            );


          if (!match) {
            return value;
          }


          const year =
            Number(match[1]);


          const monthIndex =
            Number(match[2]) - 1;


          const day =
            Number(match[3]);


          const months = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
          ];


          return (
            day +
            " " +
            months[monthIndex] +
            " " +
            year
          );

        }


        /* =========================================
           LOCAL REACTION CHECK
           같은 브라우저에서 같은 반응 반복 방지
        ========================================= */

        function reactionStorageKey(
          noteId,
          reaction
        ) {

          return (
            "kwakcamole-note-reaction:" +
            noteId +
            ":" +
            reaction
          );

        }


        function hasReacted(
          noteId,
          reaction
        ) {

          try {

            return (
              localStorage.getItem(
                reactionStorageKey(
                  noteId,
                  reaction
                )
              ) === "1"
            );

          } catch (error) {

            return false;

          }

        }


        function saveReactionLocally(
          noteId,
          reaction
        ) {

          try {

            localStorage.setItem(
              reactionStorageKey(
                noteId,
                reaction
              ),
              "1"
            );

          } catch (error) {

            console.warn(
              "Could not save reaction locally."
            );

          }

        }


        /* =========================================
           LOAD REACTION COUNTS
        ========================================= */

        async function loadReactionCounts(
          noteId
        ) {

          const buttons =
            document.querySelectorAll(
              ".note-reaction-button"
            );


          const {
            data,
            error
          } =
            await supabase

              .from(
                "soft_note_reactions"
              )

              .select(
                "reaction"
              )

              .eq(
                "note_id",
                String(noteId)
              );


          if (error) {

            console.error(error);

            return;

          }


          const counts = {
            heart: 0,
            star: 0,
            cloud: 0
          };


          data.forEach(
            function (item) {

              if (
                Object.prototype.hasOwnProperty.call(
                  counts,
                  item.reaction
                )
              ) {

                counts[
                  item.reaction
                ] += 1;

              }

            }
          );


          buttons.forEach(
            function (button) {

              const reaction =
                button.dataset.reaction;


              const countElement =
                button.querySelector(
                  ".reaction-count"
                );


              countElement.textContent =
                counts[reaction] || 0;


              if (
                hasReacted(
                  noteId,
                  reaction
                )
              ) {

                button.classList.add(
                  "is-selected"
                );


                button.setAttribute(
                  "aria-pressed",
                  "true"
                );


                button.disabled =
                  true;

              }

            }
          );

        }


        /* =========================================
           REACTION BUTTONS
        ========================================= */

        function setupReactions(
          noteId
        ) {

          const buttons =
            document.querySelectorAll(
              ".note-reaction-button"
            );


          const status =
            document.getElementById(
              "reactionStatus"
            );


          buttons.forEach(
            function (button) {

              button.addEventListener(
                "click",
                async function () {

                  const reaction =
                    button.dataset.reaction;


                  if (
                    hasReacted(
                      noteId,
                      reaction
                    )
                  ) {

                    status.textContent =
                      "you already left this feeling ♡";

                    return;

                  }


                  button.disabled =
                    true;


                  status.textContent =
                    "saving your feeling...";


                  const {
                    error
                  } =
                    await supabase

                      .from(
                        "soft_note_reactions"
                      )

                      .insert({
                        note_id:
                          String(noteId),

                        reaction:
                          reaction
                      });


                  if (error) {

                    console.error(error);


                    button.disabled =
                      false;


                    status.textContent =
                      "couldn't save it. try again ♡";


                    return;

                  }


                  saveReactionLocally(
                    noteId,
                    reaction
                  );


                  const countElement =
                    button.querySelector(
                      ".reaction-count"
                    );


                  const currentCount =
                    Number(
                      countElement.textContent
                    ) || 0;


                  countElement.textContent =
                    currentCount + 1;


                  button.classList.add(
                    "is-selected"
                  );


                  button.setAttribute(
                    "aria-pressed",
                    "true"
                  );


                  button.disabled =
                    true;


                  status.textContent =
                    "thank you for leaving a feeling ♡";


                  setTimeout(
                    function () {

                      status.textContent =
                        "";

                    },
                    2500
                  );

                }
              );

            }
          );


          loadReactionCounts(
            noteId
          );

        }


        /* =========================================
           NOTE RENDER
        ========================================= */

        function renderNote(notes) {

          const selectedNote =
            notes.find(
              function (note) {

                return (
                  String(note.id) ===
                  String(requestedId)
                );

              }
            );


          if (!selectedNote) {

            noteArticle.innerHTML = `
              <div class="note-message">

                해당 연구일지를 찾을 수 없습니다.<br>

                <a href="/notes">
                  Soft Notes 목록으로 돌아가기
                </a>

              </div>
            `;

            return;

          }


          /*
            브라우저 탭 제목 변경
          */

          document.title =
            selectedNote.title +
            " — Soft Notes";


          const imagePath =
            getAssetPath(
              selectedNote.image
            );


          const tags =
            Array.isArray(
              selectedNote.tags
            )
              ? selectedNote.tags
              : [];


          const tagsHTML =
            tags

              .map(
                function (tag) {

                  return `
                    <span class="note-tag">
                      ${tag}
                    </span>
                  `;

                }
              )

              .join("");


          const figureHTML =
            imagePath
              ? `
                <figure class="note-figure">

                  <img
                    class="note-main-image"
                    src="${imagePath}"
                    alt="${selectedNote.imageAlt || selectedNote.title}"
                  >

                  <figcaption class="note-image-caption">
                    ${selectedNote.caption || ""}
                  </figcaption>

                </figure>
              `
              : "";


          noteArticle.innerHTML = `

            <div class="note-detail-meta">

              <span class="note-detail-number">
                No. ${selectedNote.id}
              </span>

              <time datetime="${selectedNote.datetime}">
                ${formatNoteDate(selectedNote)}
              </time>

            </div>


            <h1 class="note-detail-title">
              ${selectedNote.title}
            </h1>


            <p class="note-detail-intro">
              ${selectedNote.intro || ""}
            </p>


            ${figureHTML}


            <div class="note-body">
              ${selectedNote.content || ""}
            </div>


            <div class="note-tags">
              ${tagsHTML}
            </div>


            <!-- =================================
                 REACTIONS
            ================================== -->

            <section
              class="note-reactions"
              aria-label="Soft Note reactions"
            >

              <p class="reaction-question">
                did this stay with you?
              </p>

              <p class="reaction-sub">
                leave a tiny feeling
              </p>


              <div class="reaction-buttons">

                <button
                  class="note-reaction-button"
                  type="button"
                  data-reaction="heart"
                  aria-label="leave a heart"
                  aria-pressed="false"
                >
                  <span class="reaction-symbol">
                    ♡
                  </span>

                  <span class="reaction-count">
                    0
                  </span>
                </button>


                <button
                  class="note-reaction-button"
                  type="button"
                  data-reaction="star"
                  aria-label="leave a star"
                  aria-pressed="false"
                >
                  <span class="reaction-symbol">
                    ☆
                  </span>

                  <span class="reaction-count">
                    0
                  </span>
                </button>


                <button
                  class="note-reaction-button"
                  type="button"
                  data-reaction="cloud"
                  aria-label="leave a cloud"
                  aria-pressed="false"
                >
                  <span class="reaction-symbol">
                    ☁
                  </span>

                  <span class="reaction-count">
                    0
                  </span>
                </button>

              </div>


              <p
                class="reaction-status"
                id="reactionStatus"
                aria-live="polite"
              ></p>

            </section>

          `;


          /*
            HTML이 만들어진 다음
            반응 기능 연결
          */

          setupReactions(
            selectedNote.id
          );

        }


        /* =========================================
           LOAD NOTE DATA
        ========================================= */

        fetch(
          "/notes-data.json?v=" +
          Date.now()
        )

          .then(
            function (response) {

              if (!response.ok) {

                throw new Error(
                  "Failed to load notes"
                );

              }


              return response.json();

            }
          )

          .then(
            function (data) {

              const notes =
                Array.isArray(data)
                  ? data
                  : [];


              renderNote(
                notes
              );

            }
          )

          .catch(
            function (error) {

              console.error(error);


              noteArticle.innerHTML = `
                <div class="note-message">
                  연구일지를 불러오지 못했습니다.
                </div>
              `;

            }
          );

      }
    );

  </script>

</body>
