media:
  - name: images
    label: Images
    input: images
    output: /images
    rename: safe
    categories:
      - image


content:

  # =========================================
  # SOFT NOTES
  # =========================================

  - name: soft-notes
    label: Soft Notes
    type: file
    path: notes-data.json
    format: json
    list: true

    fields:
      - name: id
        label: No.
        type: string
        required: true
        description: "예: 001, 002, 003"

      - name: title
        label: Title
        type: string
        required: true

      - name: datetime
        label: Date
        type: date
        required: true

      - name: image
        label: Cover Image
        type: image
        options:
          media: images
          rename: safe
          categories:
            - image

      - name: imageAlt
        label: Image Description
        type: string
        description: "선택사항. 비워두면 제목을 대신 사용합니다."

      - name: caption
        label: Caption
        type: string
        description: "선택사항. 대표 이미지 아래 작은 설명."

      - name: excerpt
        label: Short Description
        type: text
        required: true
        description: "Soft Notes 목록에 보이는 짧은 소개."

      - name: intro
        label: Intro
        type: text
        description: "상세페이지 제목 아래에 보이는 짧은 소개."

      - name: content
        label: Body
        type: rich-text
        required: true
        options:
          format: html
          media: images
          rename: safe
          switcher: false
          categories:
            - image

      - name: tags
        label: Tags
        type: string
        list: true


  # =========================================
  # WORKS
  # =========================================

  - name: works
    label: Works
    type: file
    path: works-data.json
    format: json
    list: true

    fields:

      - name: title
        label: Title
        type: string
        required: true

      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images
          rename: safe
          categories:
            - image

      # 화면에는 안 보임.
      # 새 작품은 자동으로 Visual Stories로 저장.
      - name: category
        label: Category
        type: string
        hidden: true
        default: visual-stories


settings:
  content:
    merge: true